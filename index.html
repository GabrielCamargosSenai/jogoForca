<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca da Música</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="principal">
        <h1 class="titulo">Forca da Música🎧</h1>
        <svg width="200" height="250" stroke="black" stroke-width="4" fill="none">
            <!-- Forca (fica sempre visível) -->
             <!-- Auxilio da I.A -->
            <path d="M20 240 H100 M50 240 V20 H130 V50" />

            <!-- Boneco -->
            <circle id="cabeca" cx="130" cy="70" r="20" />
            <line id="tronco" x1="130" y1="90" x2="130" y2="160" />
            <line id="braco-esquerdo" x1="130" y1="110" x2="100" y2="140" />
            <line id="braco-direito" x1="130" y1="110" x2="160" y2="140" />
            <line id="perna-esquerda" x1="130" y1="160" x2="105" y2="200" />
            <line id="perna-direita" x1="130" y1="160" x2="155" y2="200" />
        </svg>

        <p class="sub">
            Palavra: <span id="digito"></span>
        </p>
        <p class="sub">
            Tentativas: <span id="tentativas"></span>
        </p>
        <p class="sub">
            Letras Invalídas: <span id="invalidas"></span>
        </p>

        <input type="text" id="palavra" placeholder="Digite uma letra">
        <button id="btn-confirmar">Confirmar</button>
        <br>
        <button id="btn-reinicio">Reiniciar</button>
    </div>

    <div id="status"></div>

    <script src="script.js"></script>

</body>

</html>
